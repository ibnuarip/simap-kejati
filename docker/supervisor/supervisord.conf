; supervisord.conf — Process Manager di dalam Container

; Supervisor menjalankan BEBERAPA proses dalam 1 container:
;   1. PHP-FPM    → Menjalankan kode PHP Laravel
;   2. Queue Worker → Memproses background jobs (email, notifikasi, export, dll)
;
; Kenapa Supervisor?
;   Satu container idealnya 1 proses, tapi untuk setup sederhana,
;   Supervisor memudahkan mengelola PHP-FPM + Queue Worker bersamaan.
;
; Catatan: 3 section di bawah (unix_http_server, rpcinterface, supervisorctl)
; hanya supaya perintah ini berfungsi di dalam container:
;   docker compose exec app supervisorctl status
;   docker compose exec app supervisorctl restart queue-worker


[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[supervisord]
nodaemon=true                       ; Jalankan di foreground (wajib untuk Docker)
user=root                           ; Supervisor jalan sebagai root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
logfile_maxbytes=5MB                ; Rotasi log setelah 5MB
logfile_backups=3                   ; Simpan 3 backup log

; PHP-FPM
; Proses utama yang menjalankan kode PHP
[program:php-fpm]
command=php-fpm                     ; Jalankan PHP-FPM
autostart=true                      ; Otomatis start saat Supervisor jalan
autorestart=true                    ; Restart otomatis jika crash
priority=10                         ; Start duluan (priority lebih rendah = duluan)
stdout_logfile=/dev/stdout          ; Log ke stdout (terlihat di docker compose logs)
stdout_logfile_maxbytes=0           ; Tidak ada limit (karena ke stdout)
stderr_logfile=/dev/stderr          ; Error log ke stderr
stderr_logfile_maxbytes=0

;  Queue Worker
; Memproses antrian job di background (email, notifikasi, generate PDF/Excel)
[program:queue-worker]
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --memory=128
;        │                                   │       │         │          │               │
;        │                                   │       │         │          │               └─ Max memory 128MB
;        │                                   │       │         │          └─ Max runtime 1 jam (lalu restart)
;        │                                   │       │         └─ Coba 3x sebelum gagal
;        │                                   │       └─ Tidur 3 detik jika tidak ada job
;        │                                   └─ Pakai Redis sebagai queue driver
;        └─ Path ke artisan di dalam container
autostart=true
autorestart=true
priority=20                         ; Start setelah PHP-FPM
user=www-data                       ; Jalankan sebagai www-data (bukan root!)
numprocs=1                          ; Jumlah worker (tambah jika job banyak)
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=3600                   ; Tunggu max 1 jam sebelum force kill
