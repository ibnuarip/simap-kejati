# Nginx Configuration — SIMAP Kejati
# Nginx berperan sebagai REVERSE PROXY:
#   - Request file statis (CSS, JS, gambar) → dilayani langsung oleh Nginx
#   - Request PHP → diteruskan ke PHP-FPM (container "app") via FastCGI
#
# Flow request:
#   Browser → Nginx (port 80) → PHP-FPM (port 9000) → Laravel → Response


server {
    # Port & Server Name
    listen 80;                          # Listen di port 80 (HTTP)
    server_name localhost;              # Hostname (ganti untuk production)
    root /var/www/html/public;          # Document root = folder public Laravel

    # Index File
    index index.php index.html;

    # Character Set
    charset utf-8;

    # Upload Size
    # Sesuaikan dengan kebutuhan upload foto/dokumen
    # Harus sinkron dengan php.ini (upload_max_filesize & post_max_size)
    client_max_body_size 50M;

    # Request Buffering
    client_body_buffer_size 16K;
    client_header_buffer_size 1K;
    large_client_header_buffers 4 16K;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Main Location Block
    # Ini adalah INTI routing Laravel:
    #   1. Coba cari file/folder yang diminta ($uri)
    #   2. Kalau tidak ada, arahkan ke index.php (Laravel router handle sisanya)
    # Ini yang membuat URL seperti /dashboard, /users, dll bisa bekerja
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP Processing
    # Semua request .php diteruskan ke PHP-FPM di container "app"
    location ~ \.php$ {
        # Cegah eksekusi PHP di lokasi yang tidak seharusnya
        try_files $uri =404;

        # FastCGI settings
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;          # "app" = nama service di docker-compose
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Buffer settings untuk response besar (PDF, Excel export)
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;

        # Timeout lebih panjang untuk proses berat (generate report)
        fastcgi_read_timeout 300s;
    }

    # Static Assets Caching
    # File statis di-cache browser selama 30 hari (hemat bandwidth)
    # Vite sudah menambahkan hash ke filename, jadi cache-busting otomatis
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 30d;                    # Cache 30 hari
        add_header Cache-Control "public, immutable";
        access_log off;                 # Tidak perlu log untuk asset statis
        try_files $uri =404;
    }

    # Vite Build Assets
    # Folder build/ dari Vite — cache agresif karena filename sudah di-hash
    location /build/ {
        expires max;                    # Cache selamanya (sampai hash berubah)
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Uploaded Files (/storage/...) 
    # File hasil upload disimpan di /var/www/html/storage/app/public.
    # Folder ini di-share sebagai volume yang sama dengan container "app",
    # jadi Nginx selalu melihat file terbaru tanpa perlu symlink
    # public/storage (symlink tidak selalu bisa dibuat di Windows).
    #
    # CATATAN: pakai alias, BUKAN root/symlink. Alias menunjuk langsung ke
    # folder upload, sehingga tidak bergantung pada storage:link.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # WebAuthn / Passkeys Well-Known Endpoint
    # Endpoint ini berawalan titik (/.well-known/passkey-endpoints), jadi tanpa
    # blok ini akan kena rule "deny all" di bawah dan Passkey Always 403.
    # ^~_make regex location di bawah tidak ikut dicek untuk URL ini.
    location ^~ /.well-known/ {
        try_files $uri /index.php$is_args$args;
    }

    # Security: Block Hidden Files
    # Cegah akses ke file .env, .git, .htaccess, dll
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Favicon & Robots
    # Jangan spam log untuk file yang sering diminta tapi tidak ada
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Error Page
    # Semua error 404 diarahkan ke Laravel (supaya Laravel handle error page)
    error_page 404 /index.php;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    # Kompres response untuk menghemat bandwidth
    gzip on;
    gzip_comp_level 5;                  # Level 5 = balance antara CPU & kompresi
    gzip_min_length 256;                # Jangan kompres file < 256 bytes
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/opentype
        font/ttf
        font/woff
        font/woff2;
}
