; php.ini — Konfigurasi PHP untuk Docker Container
; File ini di-mount ke container untuk override setting default PHP.
; Fokus: upload foto, generate PDF/Excel, dan performa production.
;
; Cara cek setting aktif di container:
;   docker compose exec app php -i | grep upload_max_filesize


; Upload & POST Settings
; Untuk upload foto dan dokumen
; PENTING: Harus sinkron dengan client_max_body_size di Nginx (50M)
upload_max_filesize = 50M           ; Ukuran maksimal per file upload
post_max_size = 55M                 ; Total POST (harus > upload_max_filesize)
max_file_uploads = 20               ; Maksimal file dalam 1x upload

; Memory & Execution
; Untuk generate PDF/Excel yang besar (banyak data)
memory_limit = 256M                 ; Memori per request (256MB cukup untuk laporan besar)
max_execution_time = 300            ; Timeout 5 menit (untuk export data besar)
max_input_time = 300                ; Timeout parsing input (upload file besar)
max_input_vars = 5000               ; Untuk form dengan banyak field

;Error Handling
; Development: tampilkan error. Production: ubah ke Off
display_errors = Off                ; Jangan tampilkan error ke browser (security)
display_startup_errors = Off        ; Jangan tampilkan startup error
log_errors = On                     ; Catat error ke log file
error_log = /var/log/php/error.log  ; Lokasi log file
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

;Timezone
date.timezone = Asia/Jakarta        ; WIB (Waktu Indonesia Barat)

; Session
session.gc_maxlifetime = 7200       ; Session expired setelah 2 jam
session.cookie_httponly = 1         ; Cookie tidak bisa diakses JavaScript (security)
session.cookie_secure = 0           ; Set ke 1 jika pakai HTTPS
session.cookie_samesite = Lax       ; Proteksi CSRF

; OPcache (Performa Production)
; OPcache menyimpan bytecode PHP yang sudah di-compile
; Artinya PHP tidak perlu parse ulang file .php setiap request = LEBIH CEPAT
opcache.enable = 1                  ; Aktifkan OPcache
opcache.memory_consumption = 128    ; 128MB untuk cache bytecode
opcache.interned_strings_buffer = 16 ; Buffer untuk string yang sering dipakai
opcache.max_accelerated_files = 10000 ; Jumlah file yang bisa di-cache
opcache.validate_timestamps = 1     ; Cek perubahan file (set 0 di production murni)
opcache.revalidate_freq = 2         ; Cek perubahan setiap 2 detik
opcache.save_comments = 1           ; Simpan PHPDoc (dibutuhkan Laravel)

; Realpath Cache
; Cache path resolution (include, require) — percepat autoloading
realpath_cache_size = 4096K
realpath_cache_ttl = 600            ; Cache 10 menit

; GD Settings
; GD sudah di-enable via Dockerfile, ini pengaturan tambahan
; Tidak perlu konfigurasi khusus — GD berjalan dengan setting default

; Multibyte String
; Untuk handling karakter Indonesia dengan benar
mbstring.internal_encoding = UTF-8
