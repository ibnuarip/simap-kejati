# docker-compose.yml — Orkestrasi SIMAP Kejati

services:
    # app: PHP-FPM + Laravel
    app:
        image: simap-app
        build:
            context: .
            dockerfile: Dockerfile
        container_name: simap-app
        restart: unless-stopped
        env_file:
            - .env.docker
        volumes:
            - app-storage:/var/www/html/storage/app
        networks:
            - simap-network
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started

    # node: Vite Development Server
    node:
        image: node:24-alpine
        container_name: simap-node
        restart: unless-stopped
        working_dir: /app
        environment:
            NODE_ENV: development
            VITE_WATCH_POLLING: 'true'
            VITE_APP_NAME: ${VITE_APP_NAME:-SIMAP}
            VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
            APP_URL: 'http://localhost:${SIMAP_HTTP_PORT:-8080}'
            WAYFINDER_COMMAND: 'true'
        ports:
            - '${SIMAP_VITE_PORT:-5173}:5173'
        volumes:
            - ./resources:/app/resources:cached
            - ./public:/app/public:cached
            - ./routes:/app/routes:cached
            - ./package.json:/app/package.json:cached
            - ./package-lock.json:/app/package-lock.json:cached
            - ./.npmrc:/app/.npmrc:cached
            - ./vite.config.ts:/app/vite.config.ts:cached
            - ./tsconfig.json:/app/tsconfig.json:cached
            - ./components.json:/app/components.json:cached
            - node_modules:/app/node_modules
        networks:
            - simap-network
        command: sh -c "npm install -g --allow-scripts=pnpm pnpm@10 && npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"

    # nginx: Web Server
    nginx:
        image: nginx:1.27-alpine
        container_name: simap-nginx
        restart: unless-stopped
        ports:
            - '${SIMAP_HTTP_PORT:-8080}:80'
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/var/www/html/public:ro
            - app-storage:/var/www/html/storage/app:ro
        networks:
            - simap-network
        depends_on:
            - app

    # mysql: Database Server
    mysql:
        image: mysql:8.4
        container_name: simap-mysql
        restart: unless-stopped
        env_file:
            - .env.docker
        ports:
            - '${SIMAP_MYSQL_PORT:-3307}:3306'
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - simap-network
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    # redis: Cache & Queue Broker
    redis:
        image: redis:7-alpine
        container_name: simap-redis
        restart: unless-stopped
        ports:
            - '${SIMAP_REDIS_PORT:-6380}:6379'
        volumes:
            - redis-data:/data
        networks:
            - simap-network
        command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
    mysql-data:
        driver: local
    redis-data:
        driver: local
    app-storage:
        driver: local
    node_modules:
        driver: local

networks:
    simap-network:
        driver: bridge
